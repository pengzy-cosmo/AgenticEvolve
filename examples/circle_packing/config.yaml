task:
  initial_program: initial_program.py
  evaluator: evaluator.py
  description: |
    Improve pack() in program.py: place 26 non-overlapping circles inside
    the unit square to maximize the sum of their radii.

    Interface: pack() takes no arguments and returns (centers, radii),
    numpy arrays of shape (26, 2) and (26,). Circles must lie inside the
    square and must not overlap (tolerance 1e-9). pack() must be
    reproducible: seed any randomness it uses. It may run numerical
    optimization internally; the evaluation must finish within 180
    seconds.

    Metrics:
    - sum_radii: the sum of the radii.
    - combined_score: sum_radii / 2.635, the fitness; 2.635 is the
      reference result reported by AlphaEvolve for this problem.
    - validity: 1 if the packing is valid; an invalid packing scores 0 on
      every metric.
    - radius_gini: Gini coefficient of the radii, 0 for uniform sizes and
      higher for mixed sizes.

llm:
  model: deepseek-flash

map_elites:
  features: [radius_gini]

executor:
  timeout: 180
