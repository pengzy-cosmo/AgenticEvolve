# OpenEvolve side of the circle packing task.
#
# The driver (examples/openevolve/run.py) completes this at launch: the model
# (--llm), the task description from ../config.yaml as the system message,
# our LLM client, the random seed, and the iteration budget. Everything not set
# here uses OpenEvolve's defaults.
#
# temperature matches our agent side (mycode default 1.0); max_tokens comes
# with the model (--llm). timeout bounds a whole non-streaming request; mycode
# streams, so its 300 s is idle time between chunks. DeepSeek reasons for ~30k
# tokens (about 5 min) on this prompt, so the total-time bound needs headroom.

llm:
  temperature: 1.0
  timeout: 1200
  retries: 2

prompt:
  suggest_simplification_after_chars: null  # code length is not part of the fitness

database:
  population_size: 50
  num_islands: 3
  migration_interval: 10  # the default 50 never triggers at our iteration counts
  feature_dimensions: [radius_gini]
  feature_bins: 10

evaluator:
  timeout: 200  # headroom only; the shared subprocess executor enforces the real 180 s limit
  cascade_evaluation: false
  max_retries: 0  # the evaluator is deterministic, a retry cannot change the outcome

evolution_trace:
  enabled: true
  include_prompts: true
