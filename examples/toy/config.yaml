task:
  initial_program: initial_program.py
  evaluator: evaluator.py
  description: |
    Improve search_algorithm in program.py so that run_search() reliably
    finds the global minimum of evaluate_function(x, y), a 2D function with
    many local minima on the box [-5, 5]^2. The evaluator runs run_search()
    10 times and scores the returned points with its own copy of
    evaluate_function, so keep the run_search() -> (x, y, value) interface
    and do not modify evaluate_function. Improve the search strategy:
    restarts, local refinement, adaptive steps, annealing, or any structure
    that escapes local minima.

llm:
  model: claude-sonnet-5

map_elites:
  features: [reliability, speed_score]

executor:
  timeout: 60
