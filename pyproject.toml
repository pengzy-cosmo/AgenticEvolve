[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-agentic-evolve"
version = "0.3.0"
description = "AgenticEvolve: LLM program evolution by persistent agentic sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mycode-sdk>=0.16.0",
    "numpy>=2.5.1",
    "pyyaml>=6.0",
    "scipy>=1.18.0",
]

[project.scripts]
agentic-evolve = "agentic_evolve.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
llm-srbench = [
    "sympy>=1.14.0",
]
openevolve = [
    "openevolve==0.3.2",
]

[tool.uv]
default-groups = ["dev", "llm-srbench"]

[tool.hatch.build.targets.wheel]
packages = ["agentic_evolve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ty.src]
include = ["agentic_evolve", "tests"]
